name: Publish

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-26.04
    # Trusted publishing: npm accepts this workflow's OIDC token, from the npm
    # environment, instead of a stored token. Only v* tags can use that
    # environment, so a workflow on a branch cannot publish.
    environment: npm
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - run: npm publish
